<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Not Found · Chumbley's Auto Detailing</title>
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:light dark}
  html,body{margin:0;padding:0;font-family:'Fredoka',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1419;color:#fff;min-height:100vh}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
  .wrap{max-width:42rem}
  h1{font-family:'Bangers','Bowlby One',sans-serif;font-size:clamp(3rem,10vw,7rem);margin:0 0 1rem;letter-spacing:.03em;color:#ffd400;-webkit-text-stroke:2px #111;text-shadow:6px 6px 0 #e3140f}
  p{font-size:1.1rem;line-height:1.6;color:rgba(255,255,255,0.75);margin:0 0 1.5rem}
  a{display:inline-block;padding:.85rem 1.5rem;background:#ffd400;color:#111;border:3px solid #111;border-radius:.5rem;text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:.05em;box-shadow:4px 4px 0 #111;transition:.15s}
  a:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #111}
  .meta{font-family:'Permanent Marker',sans-serif;font-size:.9rem;color:#ffd400;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}
</style>
</head>
<body>
<main class="wrap">
  <div class="meta">Issue #404</div>
  <h1>POW!</h1>
  <p>That page got away from us. Probably a typo or an old link. Head back to the home page and we'll get you sorted.</p>
  <a href="/">← Back to Home</a>
</main>
